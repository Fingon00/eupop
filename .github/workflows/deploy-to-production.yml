on:
  push:
    branches: [ "master" ]
  workflow_dispatch:
name: BuildAndDeploy
permissions:
  contents: read
  packages: write
env:
  IMAGE_REPOSITORY: ghcr.io/fingon00/eupop
concurrency:
  group: deploy-to-production-master
  cancel-in-progress: true
jobs:
  buildImage:
    name: Build & Publish Bot Image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.image.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tag
        id: image
        run: echo "image_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_REPOSITORY }}:${{ steps.image.outputs.image_tag }}
            ${{ env.IMAGE_REPOSITORY }}:master
          cache-from: type=gha
          cache-to: type=gha,mode=max
  build:
    concurrency:
      group: "Start Bot"
    needs: [buildImage]
    name: Pull & Deploy Bot
    runs-on: ubuntu-latest
    steps:
      - name: Execute remote ssh commands
        uses: appleboy/ssh-action@master
        env:
            DISCORD_BOT_TOKEN: ${{ secrets.DISCORD_BOT_TOKEN }}
            DISCORD_BOT_USERID: ${{ secrets.DISCORD_BOT_USERID }}
            REPO_DISPATCH_TOKEN: ${{ secrets.REPOSITORY_DISPATCH_TOKEN }}
            POSTGRES_JDBC_URL: ${{ vars.POSTGRES_JDBC_URL }}
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_USER: ${{ vars.POSTGRES_USER }}
            HOST_OOTIE_REPO_DIR: ${{ vars.HOST_OOTIE_REPO_DIR }}
            DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
            DISCORD_CLIENT_SECRET: ${{ secrets.DISCORD_CLIENT_SECRET }}
        with:
            host: ${{ secrets.HOSTINGER_SSH_HOST }}
            username: ${{ secrets.HOSTINGER_SSH_USER }}
            password: ${{ secrets.HOSTINGER_SSH_PASSWORD }}
            port: ${{ secrets.HOSTINGER_SSH_PORT }}
            command_timeout: 30m
            envs: HOST_OOTIE_REPO_DIR, DISCORD_BOT_TOKEN, DISCORD_BOT_USERID, REPO_DISPATCH_TOKEN, POSTGRES_JDBC_URL, POSTGRES_PASSWORD, POSTGRES_USER, DISCORD_CLIENT_ID, DISCORD_CLIENT_SECRET
            script: |
              set -eu

              echo "Pulling deployment config from GitHub..."
              cd ${{ vars.HOST_OOTIE_REPO_DIR }}
              git pull --ff-only
              export HOST_OOTIE_REPO_DIR="${{ vars.HOST_OOTIE_REPO_DIR }}"
              export GUILDID_LIST="${{ vars.GUILDID_LIST }}"
              export COMPOSE_PROJECT_NAME="ootie-bot"
              export IMAGE_REPOSITORY="${{ env.IMAGE_REPOSITORY }}"
              export IMAGE_TAG="${{ needs.buildImage.outputs.image_tag }}"
              compose_file="docker-compose.production.yml"

              timestamp=$(date "+%F %T.%3N")
              docker version
              docker compose -f "$compose_file" pull ootiebot
             
              COMPOSE_FILE="$compose_file" ROLLOUT_TIMEOUT_SECONDS=540 bash scripts/deploy_ootiebot_single_instance.sh

              timestamp=$(date "+%F %T.%3N")
              running_ootiebot_containers="$(docker ps -q --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" --filter "label=com.docker.compose.service=ootiebot" || true)"
              running_ootiebot_count="$(printf '%s\n' "$running_ootiebot_containers" | sed '/^$/d' | wc -l | tr -d ' ')"
              if [ "$running_ootiebot_count" -gt 1 ]; then
                desired_ootiebot_container="$(docker ps -q --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" --filter "label=com.docker.compose.service=ootiebot" --filter "ancestor=${IMAGE_REPOSITORY}:${IMAGE_TAG}" | head -n 1 || true)"
                if [ -z "$desired_ootiebot_container" ]; then
                  desired_ootiebot_container="$(printf '%s\n' "$running_ootiebot_containers" | sed '/^$/d' | head -n 1)"
                fi

                echo "Found $running_ootiebot_count running ootiebot containers. Keeping $desired_ootiebot_container and removing extras..."
                for container in $running_ootiebot_containers; do
                  if [ "$container" != "$desired_ootiebot_container" ]; then
                    docker stop --time 600 "$container"
                    docker rm "$container"
                  fi
                done
              fi

              running_ootiebot_containers="$(docker ps -q --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" --filter "label=com.docker.compose.service=ootiebot" || true)"
              running_ootiebot_count="$(printf '%s\n' "$running_ootiebot_containers" | sed '/^$/d' | wc -l | tr -d ' ')"
              if [ "$running_ootiebot_count" -ne 1 ]; then
                echo "Expected exactly one running ootiebot container, found $running_ootiebot_count" >&2
                docker ps --filter "label=com.docker.compose.project=${COMPOSE_PROJECT_NAME}" --filter "label=com.docker.compose.service=ootiebot"
                exit 1
              fi
              
              timestamp=$(date "+%F %T.%3N")
              echo "Cleaning up docker stuff..."
              
              docker image prune --force --filter until=48h
              docker builder prune --force --filter until=48h
              
              echo "DONE!"
